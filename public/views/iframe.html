<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>VCPeer Iframe demo</title>

        <!-- Served from the same origin as the app, so this loads VCPeer's own iframe.js. -->
        <script src="/js/iframe.js" defer></script>

        <script>
            document.addEventListener('DOMContentLoaded', function () {
                const domain = window.location.host; // e.g. vcpeer.com
                const options = {
                    room: 'test',
                    name: 'guest',
                    avatar: '/images/logo.svg',
                    audio: 0,
                    video: 0,
                    screen: 0,
                    hide: 0,
                    notify: 0,
                    duration: 'unlimited', // HH:MM:SS
                    token: null,
                    width: '100vw',
                    height: '100vh',
                    parentNode: document.querySelector('#meet'),
                };
                const api = new IframeApi(domain, options);
            });
        </script>
    </head>
    <body>
        <div id="meet"></div>
    </body>
</html>
