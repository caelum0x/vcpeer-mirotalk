<!doctype html>
<html lang="en" class="no-js">
    <head>
        <!-- Title and Icon -->

        <title id="loginTitle">VCPeer - Host Protected login required.</title>
        <link id="shortcutIcon" rel="shortcut icon" href="../images/logo.svg" />
        <link id="appleTouchIcon" rel="apple-touch-icon" href="../images/logo.svg" />

        <!-- Meta Information -->

        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="darkreader-lock" />

        <meta
            name="description"
            content="Free, peer-to-peer video calls in your browser. No account, no download, no time limit."
        />

        <!-- https://ogp.me -->

        <meta property="og:type" content="{{OG_TYPE}}" />
        <meta property="og:site_name" content="{{OG_SITE_NAME}}" />
        <meta property="og:title" content="{{OG_TITLE}}" />
        <meta property="og:description" content="{{OG_DESCRIPTION}}" />
        <meta property="og:image" content="{{OG_IMAGE}}" />
        <meta property="og:url" content="{{OG_URL}}" />

        <!-- StyleSheet -->

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=IBM+Plex+Sans:400,600" />
        <link rel="stylesheet" href="../css/_tokens.css" />
        <link rel="stylesheet" href="../css/landing.css" />
        <link rel="stylesheet" href="../css/login.css" />

        <!-- Js scripts -->

        <script async src="../js/stats.js"></script>
        <script defer src="../js/insights.js"></script>
        <script defer src="../js/i18n.js"></script>

        <script src="https://unpkg.com/animejs@3.0.1/lib/anime.min.js"></script>
        <script src="https://unpkg.com/scrollreveal@4.0.0/dist/scrollreveal.min.js"></script>

        <!-- xss -->
        <script src="https://cdn.jsdelivr.net/npm/xss/dist/xss.min.js"></script>

        <!-- axios -->
        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

        <!-- sweetalert -->
        <script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11.4.8"></script>

    </head>
    <body class="has-animations">
        <div class="body-wrap">
            <header class="site-header reveal-from-top">
                <div class="container">
                    <div class="site-header-inner">
                        <div class="brand">
                            <div class="m-0"></div>
                        </div>
                    </div>
                </div>
            </header>
            <main class="site-content mt-32">
                <section class="hero section illustration-section-01">
                    <div class="container">
                        <div class="hero-inner section-inner">
                            <div class="split-wrap invert-mobile">
                                <div class="split-item">
                                    <div class="hero-content split-item-content center-content-mobile">
                                        <div
                                            id="loginForm"
                                            class="login-card reveal-from-bottom"
                                            data-reveal-delay="150"
                                            role="form"
                                            aria-label="Login"
                                        >
                                            <div class="login-icon">
                                                <i class="fa-solid fa-lock"></i>
                                            </div>
                                            <h2 id="loginHeading" class="login-title">Welcome back</h2>
                                            <p id="loginDescription" class="login-description">
                                                Enter your credentials to continue.
                                            </p>
                                            <div class="login-input-group">
                                                <i class="fa-solid fa-user"></i>
                                                <input
                                                    id="username"
                                                    class="form-input"
                                                    type="name"
                                                    placeholder="Username"
                                                    maxlength="254"
                                                    required
                                                />
                                            </div>
                                            <div class="login-input-group">
                                                <i class="fa-solid fa-key"></i>
                                                <input
                                                    id="password"
                                                    class="form-input"
                                                    type="password"
                                                    maxlength="36"
                                                    placeholder="Password"
                                                    required
                                                />
                                                <i id="togglePassword" class="fa-solid fa-eye toggle-password"></i>
                                            </div>
                                            <button id="loginButton" class="login-btn pulse">
                                                <i class="fa-solid fa-right-to-bracket"></i>&nbsp;
                                                <span id="loginButtonLabel">Login</span>
                                            </button>
                                        </div>
                                        <!-- Join Room Section hidden -->
                                        <div id="joinRoomForm" class="login-card">
                                            <div class="login-icon">
                                                <i class="fa-solid fa-video"></i>
                                            </div>
                                            <h2 id="joinRoomTitle" class="join-room-title">
                                                Pick name.<br />
                                                Share URL.<br />
                                                Start conference.
                                            </h2>
                                            <div class="room-input-row">
                                                <div class="login-input-group">
                                                    <i class="fa-solid fa-door-open"></i>
                                                    <input
                                                        id="roomName"
                                                        class="form-input"
                                                        type="text"
                                                        placeholder="Enter room name"
                                                        maxlength="64"
                                                        required
                                                    />
                                                </div>
                                                <button
                                                    id="randomRoomButton"
                                                    class="random-room-btn"
                                                    title="Generate random room name"
                                                >
                                                    <i class="fa-solid fa-arrows-rotate" aria-hidden="true"></i>
                                                </button>
                                                <button
                                                    id="shareRoomButton"
                                                    class="share-room-btn"
                                                    title="Share room link"
                                                >
                                                    <i class="fa-solid fa-share-nodes" aria-hidden="true"></i>
                                                </button>
                                            </div>
                                            <button id="joinSelectRoomButton" class="join-room-btn">
                                                <i class="fa-solid fa-right-to-bracket"></i>&nbsp;
                                                <span id="joinRoomButtonLabel">JOIN ROOM</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            </main>

            <footer id="footer" class="site-footer center-content-mobile">
                <div class="container">
                    <div class="site-footer-inner">
                        <div class="footer-top space-between text-xxs">
                            <div class="brand"></div>
                            <div class="footer-social">
                                <ul class="list-reset">
                                    <li class="footer-social-icon">
                                        <a
                                            target="_blank"
                                            rel="noopener noreferrer"
                                            href="https://github.com/caelum0x/vcpeer-mirotalk"
                                            aria-label="VCPeer source code on GitHub"
                                            title="VCPeer source code (AGPL-3.0)"
                                        >
                                            <svg
                                                width="16"
                                                height="16"
                                                viewBox="0 0 16 16"
                                                xmlns="http://www.w3.org/2000/svg"
                                            >
                                                <title>GitHub</title>
                                                <path
                                                    d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
                                                />
                                            </svg>
                                        </a>
                                    </li>
                                </ul>
                            </div>
                        </div>
                        <div class="footer-bottom space-between text-xxs invert-order-desktop">
                            <nav class="footer-nav">
                                <ul class="list-reset">
                                    <li>
                                        <a
                                            href="https://github.com/caelum0x/vcpeer-mirotalk"
                                            target="_blank"
                                            rel="noopener noreferrer"
                                            >Source code</a
                                        >
                                    </li>
                                    <li>
                                        <a href="/privacy">Privacy</a>
                                    </li>
                                    <li>
                                        <a href="mailto:hello@vcpeer.com">Contact</a>
                                    </li>
                                </ul>
                            </nav>
                            <div class="footer-copyright">&copy; 2026 VCPeer</div>
                        </div>
                    </div>
                </div>
            </footer>
        </div>

        <script defer src="../js/swal.js"></script>
        <script defer src="../js/utils.js"></script>
        <script defer src="../js/login.js"></script>
        <script defer src="../js/brand.js"></script>
        <script defer src="../js/landing.js"></script>
        <script async defer src="https://buttons.github.io/buttons.js"></script>
    </body>
</html>
