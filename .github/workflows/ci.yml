name: CI

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-22.04 # LTS
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'  # LTS

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Create config from template
        run: cp app/src/config.template.js app/src/config.js

      - name: Run unit tests
        # JWT_KEY has no default — app/src/jwtSecret.js throws at startup
        # without one (see config.template.js's "Required" comment on
        # config.jwt.key) — so every test that spawns the real server
        # (test-sendRoute, test-sendE2E, test-sendLinkE2E, test-launchboardRoute,
        # test-notifyRoute, ...) was failing its "before all" hook with
        # "Server did not become ready in time" long before this workflow's
        # push-trigger gap was fixed. CI-only throwaway value, never a real secret.
        run: npm test
        env:
          JWT_KEY: ci-only-throwaway-secret-not-used-anywhere-real-00000000

  # The upstream "build" job (Docker Buildx -> push to Docker Hub
  # mirotalk/p2p:latest) was inherited as-is from the mirotalk/p2p fork point
  # and never adapted: VCPeer doesn't deploy via Docker Hub (see
  # deploy/README.md — plain `git clone` + npm install + pm2 on the Oracle
  # box), this fork has no DOCKERHUB_USERNAME/DOCKERHUB_ACCESS_TOKEN secrets,
  # and mirotalk/p2p isn't a namespace this repo can push to anyway. Dropped
  # rather than left to fail on every push.
