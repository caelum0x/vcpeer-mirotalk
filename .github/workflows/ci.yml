name: CI

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-22.04 # LTS
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'  # LTS

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Create config from template
        run: cp app/src/config.template.js app/src/config.js

      - name: Run unit tests
        run: npm test

  # The upstream "build" job (Docker Buildx -> push to Docker Hub
  # mirotalk/p2p:latest) was inherited as-is from the mirotalk/p2p fork point
  # and never adapted: VCPeer doesn't deploy via Docker Hub (see
  # deploy/README.md — plain `git clone` + npm install + pm2 on the Oracle
  # box), this fork has no DOCKERHUB_USERNAME/DOCKERHUB_ACCESS_TOKEN secrets,
  # and mirotalk/p2p isn't a namespace this repo can push to anyway. Dropped
  # rather than left to fail on every push.
